# Ubuntu 24.04 / PHP 8.3. Thay server_name, đường dẫn và socket nếu khác.
server {
    listen 80;
    server_name eshop.example.com;
    root /var/www/eshop/public;
    index index.php;
    server_tokens off;
    charset utf-8;
    client_max_body_size 42m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /uploads/ {
        location ~ /\. { deny all; }
        location ~* \.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)(?:/|$) { deny all; }
        location ~* \.(?:jpg|jpeg|png|webp)$ { try_files $uri =404; expires 7d; }
        try_files $uri =404;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php(?:/|$) { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(?:env|ini|sql|log|bak)$ { deny all; }
    location ~* ^/assets/.*\.(?:css|js|jpg|jpeg|png|webp|svg|ico|woff2)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
    access_log /var/log/nginx/eshop-access.log;
    error_log /var/log/nginx/eshop-error.log;
}

